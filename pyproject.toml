[project]
name = "terminal-progress-bar"
version = "0.1.0"
description = "Shared terminal progress bars for parallel scripts and processes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "watchdog>=4.0.0",
]

[project.scripts]
tpb = "tpb.cli:main"
tpb-mcp = "tpb.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tpb"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
